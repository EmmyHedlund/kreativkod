<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magisk skog med AI-aura</title>

<!-- Kopplar HTML-sidan till CSS-filen som styr utseendet och bakgrundens olika lager. -->
<link rel="stylesheet" href="style.css">

<!-- Laddar p5.js för kameran och de visuella effekterna, samt Tone.js för ljudet. -->
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js"></script>
</head>
<body>


<!-- Innehåller hela skogsmiljön med bakgrund, dimma, ljus och eldflugor. -->
<div class="scen">

  <!-- Skapar ett SVG-filter som får delar av skogen att se ut som att de rör sig i vinden. DETTA ÄR AI GENERERAT -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="vind" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="4" result="brus">
        <animate attributeName="baseFrequency"
                 dur="18s" repeatCount="indefinite"
                 values="0.010 0.016; 0.014 0.011; 0.010 0.016"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="brus" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- Skogens olika lager ligger ovanpå varandra och skapar djup. AI GENERERAT-->
  <div class="lager bild"></div>
  <div class="lager blad"></div>
  <div class="lager dimma"><i></i><i></i><i></i></div>
  <div class="lager strålar"></div>

  <!-- Canvasen där eldflugorna ritas och animeras med JavaScript. -->
  <canvas id="eldflugor"></canvas>

  <!-- Lägger en mörkare ton runt skärmens kanter för att skapa en mer stämningsfull skogsmiljö. -->
  <div class="vinjett"></div>
</div>


<!-- Här lägger p5.js till sin canvas med kroppssiluetten, auran och rörelseeffekterna. -->
<main></main>

<!-- Laddar JavaScript-filerna som styr skogsmiljön och det interaktiva konstverket. -->
<script src="forest.js"></script>
<script src="sketch.js"></script>
</body>
</html>
